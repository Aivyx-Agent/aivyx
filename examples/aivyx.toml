# Aivyx — worked example config (Phase 13 Task 3)
#
# This file is the canonical worked example for the per-role
# capability envelope shipped in PRODUCT.md P9 / Phase 13. Every
# concept that touches inheritance, attenuation, trust ceilings,
# and the backcompat floor shows up at least once. It is meant
# to be copied, edited, and used as a real config — not just
# read.
#
# The example also deliberately includes the **empty-child
# surprise** case (`junior_researcher` below) so operators see
# the floor-substitution behavior in a controlled setting
# instead of discovering it in production.
#
# ----------------------------------------------------------------
# Required top-level sections (minimal — no real secrets)
# ----------------------------------------------------------------
#
# A real deployment supplies `[anthropic] api_key`, `[fs] root`,
# `[storage] path`, `[aivyx] passphrase`, etc. They are omitted
# here so the file can be loaded by tests via `LoadOptions`
# with `require_api_key = false`. Copy this file and add those
# fields before pointing a live binary at it.
#
# ----------------------------------------------------------------
# Schema for `[[role]]` entries (Phase 11 + Phase 13)
# ----------------------------------------------------------------
#
# Each `[[role]]` table-array entry adds one role to the
# `cfg.roles` map. Required key:
#
#   name = "<string>"        Role identifier. Must be unique.
#
# Phase 11 keys (legacy, still respected):
#
#   system_prompt        = "..."         Per-role prompt override
#   tool_allowlist       = ["fs.read"]   Which tool names may run
#   memory_topic_prefix  = "coder/"      Memory-topic namespace
#
# Phase 13 keys (new):
#
#   capability_scopes    = ["fs.read"]   Declared capability
#                                        envelope. The list of
#                                        scope strings the role
#                                        is allowed to *want*.
#                                        Parsed at config-load
#                                        time, so unknown bases
#                                        fail loudly with file
#                                        context.
#
#   trust_ceiling        = "Trusted"     Maximum trust tier this
#                                        role is allowed to run
#                                        at. Composes with the
#                                        channel's tier as a
#                                        second intersection
#                                        (the more-restrictive
#                                        of role / channel wins).
#                                        Valid values: Kernel,
#                                        Trusted, SemiTrusted,
#                                        Untrusted. Default:
#                                        Trusted.
#
#   parent_role          = "default"     Single-inheritance
#                                        parent. None = root.
#                                        Cycles + dangling
#                                        parents fail at load
#                                        time. A child's
#                                        declared scopes must
#                                        each be granted by some
#                                        scope on its nearest
#                                        constraining ancestor's
#                                        declared set (the
#                                        validator walks past
#                                        empty ancestors).
#
# Absent vs empty (the same rule that `tool_allowlist` already
# follows in Phase 11):
#
#   key absent           Treated as "Phase 13 has nothing to add."
#                        For `capability_scopes`: empty Vec, source
#                        = Default, and the *runtime* assembler
#                        substitutes the binary's hard-coded
#                        backcompat floor for that level.
#
#   key = []             Same as absent for `capability_scopes`.
#                        The validator skips empty levels when
#                        walking child→parent attenuation.
#
# Caveat: an *empty* `capability_scopes` is the unconstrained
# sentinel at config-load time, but at *runtime* it gets the
# backcompat floor injected per-empty-level. See the
# `junior_researcher` case below for what this means in
# practice.
#
# ----------------------------------------------------------------
# Worked roles
# ----------------------------------------------------------------

# `default` is the root of the inheritance forest. It declares
# the broadest envelope the operator wants any role in this
# config to be able to attenuate against. The unqualified
# scopes here let children declare *qualified* forms (e.g.
# `net.fetch:url-prefix:...`) and have them load cleanly under
# D4 Rule 2 (unqualified-held grants qualified-needed).
#
# Note `default` declares scopes that match the binary's
# backcompat floor in *shape* — but the floor uses a
# path-qualified `fs.read:<sandbox>/**` because the canonical
# sandbox path is only known at startup. Declaring `fs.read`
# unqualified here keeps the example file portable.
[[role]]
name = "default"
system_prompt = "You are Aivyx — a careful, deliberate AI agent."
# Phase 14 Task 2 adds unqualified `role.switch` to `default`'s
# declared envelope. Unqualified means "any target" under D4 Rule
# 2, and the root declaring it is what lets descendants (e.g.
# `coder` below) declare the qualified form `role.switch:<name>`
# and have it load cleanly through the assemble_role_envelope
# walker. A child declaring a qualifier the parent chain does not
# transitively grant would fail the config-load-time attenuation
# check, which is exactly the PRODUCT.md P1.3 "structurally
# impossible escalation" guarantee working.
capability_scopes = [
  "memory.read",
  "memory.write",
  "memory.forget",
  "fs.read",
  "fs.write",
  "net.fetch",
  "shell.exec",
  "role.switch",
]
trust_ceiling = "Trusted"

# `coder` inherits from `default` and *attenuates* it: drops
# `net.fetch` (a coder doesn't fetch URLs in this profile).
# Every declared scope is granted by `default`'s declared set
# (trivially, since each is the unqualified form), so the
# config-load-time attenuation walk passes.
#
# Effective runtime envelope (when activated):
#   coder_declared ∩ default_declared
#     = [memory.read, memory.write, memory.forget, fs.read,
#        fs.write, shell.exec]
#
# Trust ceiling intersection then folds in: `Trusted` keeps
# `shell.exec` (it is in CEILING_TRUSTED's set). The channel
# layer applies its own ceiling on top in the turn loop —
# `coder` on a SemiTrusted channel will lose `shell.exec` at
# dispatch time even though the role declared `Trusted`.
[[role]]
name = "coder"
system_prompt = "You are a pair-programmer. Reach for tests first."
# Phase 14 Task 2 adds `role.switch` to the allowlist so the
# `role.switch` tool is dispatch-layer-reachable. The allowlist
# gate and the capability gate are independent surfaces: an
# allowlist-only restriction would still need the role.switch
# capability scope below to pass the scope gate.
tool_allowlist = ["fs.read", "fs.write", "memory.read", "memory.write", "memory.forget", "shell.exec", "role.switch"]
memory_topic_prefix = "coder/"
# `role.switch:researcher` is a **qualified** switch grant — this
# coder can switch into the `researcher` role for sub-session
# work (per PRODUCT.md P1), but cannot switch into any other
# target (say, back into `default` or into `junior_researcher`).
# This qualified form is granted by `default`'s unqualified
# `role.switch` under D4 Rule 2, so the assemble_role_envelope
# walker lets it through at config-load time. After intersection
# with the parent chain, `coder`'s effective envelope holds
# `role.switch:researcher` (narrowed) rather than unqualified
# `role.switch` (widened) — the qualified form wins because
# intersection under D4 keeps the narrower scope.
capability_scopes = [
  "fs.read",
  "fs.write",
  "memory.read",
  "memory.write",
  "memory.forget",
  "shell.exec",
  "role.switch:researcher",
]
trust_ceiling = "Trusted"
parent_role = "default"

# `researcher` inherits from `default` and attenuates it
# differently: drops `fs.write` and `shell.exec`, narrows
# `net.fetch` to a single URL prefix. The qualified
# `net.fetch:url-prefix:https://httpbin.org/` is granted by
# `default.net.fetch` (unqualified) at config-load time via
# D4 Rule 2.
#
# Phase 33 adds `role.switch:junior_researcher` — the second
# link in the multi-level nesting chain. `coder` can switch
# into `researcher`, and now `researcher` can switch into
# `junior_researcher`. This demonstrates capability-bounded
# recursive nesting: each level can only narrow. The
# qualified form `role.switch:junior_researcher` is granted
# by `default`'s unqualified `role.switch` under D4 Rule 2.
#
# Trust ceiling note: `researcher` runs at `Trusted` here so
# the `fs.read` and `memory.forget` scopes survive the
# ceiling intersection — `CEILING_SEMITRUSTED` deliberately
# omits the *unqualified* `fs.read` / `fs.write` /
# `memory.forget` rows (they are "▲ rows" in the
# `aivyx-capability` ceiling table), so a SemiTrusted
# researcher would lose all three. A real deployment that
# wants a SemiTrusted researcher needs to declare
# *path-qualified* fs scopes (e.g. `fs.read:/notes/**`)
# rather than the unqualified base. That is a deliberate
# asymmetry in the capability layer: SemiTrusted forces
# qualifier discipline on filesystem access. The example
# stays at `Trusted` here so the "child attenuates parent
# scopes" teaching point isn't tangled up with the "ceiling
# strips unqualified bases" teaching point.
#
# Effective runtime envelope (when activated):
#   researcher_declared ∩ default_declared ∩ CEILING_TRUSTED
#     = [fs.read, memory.read, memory.write, memory.forget,
#        net.fetch:url-prefix:https://httpbin.org/,
#        role.switch:junior_researcher]
[[role]]
name = "researcher"
system_prompt = "You are a careful note-taker. Cite sources."
tool_allowlist = ["fs.read", "memory.read", "memory.write", "memory.forget", "web.fetch", "role.switch"]
memory_topic_prefix = "researcher/"
capability_scopes = [
  "fs.read",
  "memory.read",
  "memory.write",
  "memory.forget",
  "net.fetch:url-prefix:https://httpbin.org/",
  "role.switch:junior_researcher",
]
trust_ceiling = "Trusted"
parent_role = "default"

# `junior_researcher` is the **empty-child surprise** case.
#
# The operator's mental model: "junior_researcher inherits
# everything researcher has, but I haven't declared any of my
# own constraints, so it gets researcher's envelope verbatim."
#
# The *actual* runtime behavior under Phase 13's Q5
# resolution: an empty `capability_scopes` is the
# unconstrained sentinel at config-load time, and the runtime
# assembler substitutes the binary's **backcompat floor** for
# this level (NOT researcher's declared set). The walk then
# intersects the floor against researcher's envelope upward,
# with the path-qualified fs.read scope from the floor
# *narrowing* researcher's unqualified fs.read.
#
# Effective runtime envelope (when activated, on a Local
# channel where the floor includes `shell.exec`):
#   floor ∩ researcher_declared ∩ default_declared ∩ CEILING_TRUSTED
#
# Where `floor` is roughly:
#   [memory.read, memory.write, memory.forget,
#    fs.read:<sandbox>/**, fs.write:<sandbox>/**, net.fetch,
#    shell.exec]
#
# Working through the intersection (step 1 — `floor ∩
# researcher_declared`, which is where the surprise lives):
#   - memory.{read,write,forget}: kept (granted on both sides)
#   - fs.read:<sandbox>/** (from floor): granted by
#     researcher.fs.read (unqualified) via Rule 2, so it
#     survives in the path-qualified form
#   - researcher.fs.read (unqualified): NOT granted by
#     floor.fs.read:<sandbox>/** under Rule 4, so dropped
#     (the path-qualified form has *replaced* the
#     unqualified one)
#   - fs.write:<sandbox>/**: researcher has no fs.write at
#     all, so dropped
#   - floor.net.fetch (unqualified): NOT granted by
#     researcher.net.fetch:url-prefix:https://httpbin.org/
#     under Rule 4, so dropped
#   - researcher.net.fetch:url-prefix:https://httpbin.org/:
#     granted by floor.net.fetch via Rule 2, kept
#   - shell.exec: researcher has no shell.exec, dropped
#
# Step 2: intersect with `default_declared`. Default's
# unqualified `fs.read` grants the path-qualified form
# (Rule 2), and the rest carry through unchanged.
#
# Step 3: intersect with `CEILING_TRUSTED`. CEILING_TRUSTED
# is broad — it includes `fs.read`, `memory.forget`, and
# `net.fetch` as unqualified bases, all of which grant the
# qualified forms in our running set. Everything survives.
#
# Final junior_researcher envelope:
#   [memory.read, memory.write, memory.forget,
#    fs.read:<sandbox>/**,
#    net.fetch:url-prefix:https://httpbin.org/]
#
# Compare to `researcher`'s envelope, which is:
#   [memory.read, memory.write, memory.forget,
#    fs.read,                                       <-- unqualified
#    net.fetch:url-prefix:https://httpbin.org/]
#
# **The two roles produce different envelopes** even though
# `junior_researcher` declared an empty `capability_scopes`
# and an operator's mental model would expect them
# identical. `researcher` keeps an unqualified `fs.read`
# (and so could read any path under its tier ceiling);
# `junior_researcher` is silently narrowed to `fs.read`
# under the binary's startup-canonicalized sandbox path —
# because the *floor*, not `researcher`'s declared set, is
# what got substituted in for the empty level.
#
# The fix, if you want junior_researcher to inherit
# researcher's declared envelope verbatim: declare scopes on
# junior_researcher explicitly. The implicit-floor path is
# exactly **one level deep** — no transitive inheritance
# through empty ancestors. Phase 13 Task 2's correction
# block in `docs/PHASE_13.md` records this design
# constraint with rationale.
[[role]]
name = "junior_researcher"
system_prompt = "You are a junior researcher. Ask for help when uncertain."
tool_allowlist = ["fs.read", "memory.read", "memory.write", "memory.forget", "web.fetch"]
memory_topic_prefix = "junior_researcher/"
capability_scopes = []
trust_ceiling = "Trusted"
parent_role = "researcher"

# ----------------------------------------------------------------
# Provider selection (Phase 25)
# ----------------------------------------------------------------
#
# `[agent] provider` selects the LLM backend. Default: "anthropic".
# Supported values: "anthropic", "openai", "ollama".
#
# - "openai" targets cloud OpenAI or any compatible endpoint.
# - "ollama" is sugar for local Ollama — defaults to
#   http://localhost:11434, API key is optional, and
#   stream_options.include_usage is omitted (some Ollama
#   versions reject unknown fields).
#
# Can also be overridden via `AIVYX_PROVIDER` env var or
# `--provider` CLI flag.
#
# See `examples/aivyx-ollama.toml` for a complete local LLM
# worked example.
#
# [agent]
# provider = "openai"
#
# [openai]
# api_key = "sk-..."
# base_url = "https://api.openai.com"  # default for "openai"

# ----------------------------------------------------------------
# MCP server entries (Phase 24)
# ----------------------------------------------------------------
#
# Each `[[mcp_server]]` entry declares an MCP server that the
# daemon starts at boot and whose tools become available to agents.
# Required keys: `name` (server identifier, used in scope
# qualifiers as `mcp.call:<name>:<tool>`), `command` (executable).
# Optional: `args` (argument list, default []), `enabled` (default
# true — set false to keep the entry but skip startup).
#
# Uncomment to enable:
#
# [[mcp_server]]
# name = "github"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
#
# [[mcp_server]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# ----------------------------------------------------------------
# Notification targets (Phase 62 — Reach Milestone)
# ----------------------------------------------------------------
#
# Each `[[notify_target]]` entry declares an outbound notification
# destination the agent can push to via the `notify.send` tool.
# Four kinds:
#
#   kind = "telegram"  — uses the operator's existing bot (the
#                        same [telegram] token below) to send a
#                        message to the configured `chat_id`.
#                        Multiple Telegram targets share one bot
#                        token; each just names a different chat.
#
#   kind = "webhook"   — HTTP POST with a JSON body
#                        {source, target, subject?, message,
#                        timestamp} to the configured `url`.
#                        Suitable for ntfy.sh, Pushover, IFTTT,
#                        Slack incoming webhooks (with caveat),
#                        and custom endpoints. 5-second timeout.
#
#   kind = "email"     — Phase 68 SMTP email backend; shares
#                        the [email] block below across all
#                        email targets.
#
#   kind = "web-ui"    — Phase 69 Web UI desktop notification.
#                        Requires the Web UI server enabled
#                        below; fans out via OS-level browser
#                        Notification API + in-page toast.
#
# Required keys per kind:
#   - telegram: `name`, `kind = "telegram"`, `chat_id` (string)
#   - webhook:  `name`, `kind = "webhook"`, `url`
#                (must start with http:// or https://)
#   - email:    `name`, `kind = "email"`, `to` (recipient
#                address) — also requires the [email] block.
#   - web-ui:   `name`, `kind = "web-ui"` (no other fields)
#
# Optional: `enabled` (default true — set false to keep the
# entry but skip dispatcher registration).
#
# Capability gating: the `notify.send` scope is in CEILING_TRUSTED
# only. A role can attenuate to a specific target by declaring
# `notify.send:<name>` in `capability_scopes`; the unqualified
# `notify.send` grants any configured target.
#
# Uncomment to enable. Replace placeholder values with real ones.
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"   # your Telegram chat_id (positive for DMs,
#                         # negative for groups, e.g. -1001234567890)
#
# [[notify_target]]
# name = "ops-alerts"
# kind = "webhook"
# url = "https://ntfy.sh/aivyx-personal-2026"
#
# Phase 68 — email notify_target.
#
# Requires the [email] block below for the shared SMTP
# credentials. Each email target carries just the recipient;
# multiple targets share one [email] account.
#
# Provider notes:
#   - Gmail: SMTP host smtp.gmail.com, port 587 (STARTTLS).
#     Use an "app password" — Google requires it for SMTP
#     access when 2FA is enabled. Account settings →
#     Security → App passwords.
#   - Fastmail: SMTP host smtp.fastmail.com, port 587.
#     App password from Settings → Privacy & Security.
#   - ProtonMail: requires the ProtonMail Bridge running
#     locally (the bridge exposes SMTP on 127.0.0.1).
#   - Self-hosted Postfix / AWS SES / etc.: whatever your
#     provider documents for SMTP submission.
#
# [[notify_target]]
# name = "my-inbox"
# kind = "email"
# to = "you@example.com"
#
# [email]
# host = "smtp.fastmail.com"
# port = 587                            # default; can omit
# tls_mode = "starttls"                 # default; "implicit" → 465
# username = "you@example.com"
# password = "<app-password>"           # SMTP / app password
# from = "aivyx@example.com"
#
# Phase 69 — Web UI desktop notification.
#
# Sends an OS-level browser notification + an in-page toast
# banner to every connected Web UI browser tab. Requires the
# `[daemon] web_ui = true` (or a `web_ui_port`) below so the
# Web UI server is running. No credentials, no addresses —
# operators just grant the browser notification permission
# once when the page first loads.
#
# Pair this with `kind = "email"` or `kind = "telegram"` for
# persistence: Web UI notifications fire only while a browser
# tab is open and require the operator to be at the laptop.
#
# [[notify_target]]
# name = "desktop"
# kind = "web-ui"
#
# Example: granting the `coder` role permission to notify the
# `phone` target only (no access to `ops-alerts`):
#
#   [[role]]
#   name = "coder"
#   capability_scopes = [
#     # ... other scopes ...
#     "notify.send:phone",
#   ]
#   tool_allowlist = ["notify.send", ...]

# ----------------------------------------------------------------
# Auto-notify on trigger fire (Phase 63 — Reach Phase 2)
# ----------------------------------------------------------------
#
# `[[schedule]]`, `[[webhook]]`, and `[[file_watch]]` entries
# each accept an optional `notify_target = "..."` field. When
# set, the daemon auto-dispatches the trigger-fired turn's final
# response to the named target after the turn completes — no
# agent involvement, no system-prompt instruction needed. The
# subject is auto-generated as `<kind>: <trigger-name>`
# (e.g. `cron: morning-summary`).
#
# Capability gate: the trigger's role must have `notify.send`
# (qualified to the target, or unqualified) in its effective
# envelope. The config loader validates this at startup; a
# mismatch produces a load-time error naming both the role and
# the target rather than silently failing at 9am the next
# morning.
#
# Failure behavior: one attempt per fire. Dispatch failures are
# logged via stderr; the trigger itself is unaffected (a
# scheduled summary that did its work successfully isn't marked
# Failed just because Telegram was unreachable).
#
# Special outcomes:
# - Empty agent response → skip the dispatch (no point sending
#   an empty notification).
# - Failed turn → notification body is "Turn failed: <reason>"
#   so the operator knows their job blew up.
# - Escalated turn → "Turn escalated: <reason>".
#
# Uncomment to enable. Requires:
#  1. A matching [[notify_target]] entry above.
#  2. The trigger's role (default if unspecified) declaring
#     `notify.send` in capability_scopes.
#
# [[schedule]]
# name = "morning-summary"
# cron = "0 0 9 * * * *"   # 9:00 AM daily
# prompt = "Summarize my day's calendar, unread mail, and open issues. Reply with the summary."
# notify_target = "phone"
# wrap_mission = false

# ----------------------------------------------------------------
# Phase 72 — multi-target fan-out, default-target, conditional gate
# ----------------------------------------------------------------
#
# Three operator-feedback knobs land here:
#
# 1. `notify_targets = ["phone", "desktop"]` on a trigger fires
#    every named target concurrently. One target's transport
#    failure doesn't block the others; each per-target outcome
#    audits independently. The singular `notify_target = "phone"`
#    stays valid as a one-element alias for backwards
#    compatibility. Declaring both forms on the same trigger
#    rejects at config-load time.
#
# 2. `default = true` on ONE `[[notify_target]]` block marks it
#    as the global default. Triggers that omit `notify_targets`
#    fall through to the default at config-load time. At most
#    one default is allowed; multiple defaults reject.
#
# 3. `notify_when` on a trigger gates dispatch by turn outcome:
#      "always"               — today's behavior (default)
#      "on_failed"            — only ping on Failed | TimedOut
#      "on_completed_non_empty" — skip empty + non-completed
#                                  outcomes
#    A gate-skipped dispatch records
#    `SkippedByCondition { condition }` in the audit chain.
#
# Example — fire a daily summary to multiple targets but only
# ping the operator when the agent has something to say:
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"
# default = true
#
# [[notify_target]]
# name = "desktop"
# kind = "web-ui"
#
# [[schedule]]
# name = "morning-summary"
# cron = "0 0 9 * * * *"
# prompt = "Summarize my day. Reply only with what's actionable."
# notify_targets = ["phone", "desktop"]
# notify_when = "on_completed_non_empty"

# ----------------------------------------------------------------
# Phase 73 — per-target retry + rate-limit knobs
# ----------------------------------------------------------------
#
# Each `[[notify_target]]` block accepts four optional fields that
# tune backend behavior:
#
#   retry_count             u32, default 0, capped at 10
#   retry_backoff_ms_start  u64, default 500ms, minimum 100ms
#   rate_limit_max          u32 (must pair with window_secs)
#   rate_limit_window_secs  u64 (must pair with max)
#
# Retry behavior: on Transport / Timeout / Rejected with HTTP
# status ≥ 500, the daemon sleeps for `backoff * 2^attempt` and
# retries up to `retry_count` additional times. Auth, UnknownTarget,
# and Rejected with status < 500 are NOT retried — those need
# operator intervention or are programmer errors. retry_count = 0
# (the default) preserves Phase 62 behavior of one attempt per
# fire.
#
# Rate limit: an in-memory sliding-window token bucket per target.
# When set, the daemon admits at most `rate_limit_max` dispatch
# attempts per `rate_limit_window_secs` for the target. Excess
# attempts skip the backend call and record
# `AutoNotifyOutcomeSummary::SkippedByRateLimit` in the audit
# chain (visible in `aivyx notify history` and the Web UI
# Notifications pane). Both fields must be set together or
# neither — partial config rejects at load time. State lives in
# memory for the daemon's lifetime; daemon restart resets the
# bucket.
#
# Example — aggressive retry on a flaky webhook + a modest hourly
# cap on Telegram so a runaway loop can't flood the operator's
# phone:
#
# [[notify_target]]
# name = "alerts"
# kind = "webhook"
# url = "https://ntfy.sh/aivyx-personal-2026"
# retry_count = 5
# retry_backoff_ms_start = 200
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"
# rate_limit_max = 20
# rate_limit_window_secs = 3600

# ----------------------------------------------------------------
# Reflection auto-loop (Phase 70 — P14 self-learning closure)
# ----------------------------------------------------------------
#
# A `[[reflection_schedule]]` block declares when the agent
# should run a *reflection turn* — a turn focused on examining
# recent behavior and proposing Persona deltas (P14) that
# refine how the assistant communicates, prefers, and avoids.
# Each proposed delta is queued as a Pending row in the encrypted
# proposal store; the operator reviews via the new Web UI
# Proposals pane or `aivyx persona proposals` CLI.
#
# Why a dedicated section instead of reusing `[[schedule]]`?
# Per Q1(a) at Phase 70 sign-off: the reflection-turn semantics
# (canonical reflection prompt, outcome-summary input context,
# persistent proposal store) differ enough that operator
# clarity wins over composability.
#
# Required keys:
#   - `name`  — unique across `[[reflection_schedule]]` AND
#               `[[schedule]]` entries (single namespace).
#   - `cron`  — standard 6-field cron pattern.
#
# Optional keys (with defaults):
#   - `lookback_window_secs` — how far back to summarize turn
#       outcomes when running the reflection. Default 86400
#       (24 hours). Bounded to [60, 30 days].
#   - `role_override` — fire the reflection turn under a
#       specific role instead of the default. The named role
#       must exist in this config.
#   - `enabled` — `true` by default; `false` keeps the entry
#       in the config but skips scheduler registration.
#
# Phase 71 closes the loop: when this section is configured
# AND the daemon has an audit log open (the default for any
# normal `aivyx daemon run`), the daemon spawns a scheduler
# task that fires reflection turns on each entry's cron
# pattern. The reflection turn carries a canonical reflection
# system prompt (conservative phrasing: propose only when a
# pattern recurs ≥3 times) plus the last `lookback_window_secs`
# of TurnStarted/TurnEnded outcome summaries from the audit
# chain. Any persona deltas the agent proposes via
# `reflection.propose` land as Pending rows in the persona
# proposal chain for asynchronous operator review via the
# Web UI Proposals pane or `aivyx persona proposals` CLI.
#
# [[reflection_schedule]]
# name = "nightly-reflection"
# cron = "0 0 23 * * *"            # 11pm daily
# lookback_window_secs = 86400     # last 24 hours
# # role_override = "reflective"   # optional

# ----------------------------------------------------------------
# Memory polish (Phase 74) — search, retention, LRU
# ----------------------------------------------------------------
#
# The memory substrate (topic/body store the agent writes via
# memory.write) gained three operator knobs in Phase 74:
#
# 1. Keyword search. The agent gets a `memory.search` tool
#    (case-insensitive substring across topics + bodies);
#    operators get `aivyx memory search <query>` + the Web UI
#    Memory pane's search bar. No config — it's always
#    available to any role holding the cross-topic
#    `memory.read:topic:*` wildcard scope.
#
# 2. Per-topic retention. `[[memory.retention]]` blocks declare
#    a topic-glob pattern + a policy. The hourly GC pass walks
#    every entry, applies the FIRST matching rule, and falls
#    through to the global TTL (`[memory] ttl_secs`) for
#    unmatched topics. Put narrower globs first.
#
#    Each block sets exactly ONE of:
#      retention = "forever"   — never TTL-expire
#      retention_days = N      — evict entries older than N days
#
# 3. LRU eviction. When a topic exceeds `[memory] max_per_topic`
#    the least-recently-READ entry is evicted first (every
#    memory.read stamps last_read_at). No config knob — it's
#    automatic once max_per_topic is set.
#
# Example — keep project notes forever, expire scratch daily
# notes after 30 days, expire everything else after the global
# TTL:
#
# [memory]
# max_per_topic = 200
# ttl_secs = 7776000          # 90 days global fallback
#
# [[memory.retention]]
# topic_glob = "project/**"
# retention = "forever"
#
# [[memory.retention]]
# topic_glob = "notes/daily/*"
# retention_days = 30

# ----------------------------------------------------------------
# Topic canonicalization (Phase 89) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# For 88 phases every topic-keyed accumulator (memory, recall
# log, helpfulness ledger, co-occurrence ledger, Persona
# consolidate-pair provenance) keyed by the operator's typed
# topic VERBATIM — so `deploy`, `Deploy`, `deploys`, and
# `deploying` were four distinct topics across every signal,
# and the value that should add up across them was silently
# fragmented.
#
# Phase 89 fixes this with the smallest possible substrate
# change: an opt-in canonicalization seam at the Memory
# trait's topic-string boundary. With the flag on, every
# topic argument is lowercased + trimmed + stemmed (`ies → y`,
# `ing` / `ed` / hissing-`es` / `s` drop, with min-length +
# `ss` / non-hissing guards) before storage; lookups fold the
# same way; every downstream consumer inherits the canonical
# form through the existing pipeline.
#
# Off by default: with no `canonicalize_topics` key (or set
# to `false`) the memory layer is byte-identical to
# pre-Phase-89. No migration: existing fragmented signal
# decays out via the Phase 82/83 ~60-day half-life + Phase 77
# ~30-day recall-log retention (~quarter to converge).
#
# [memory]
# canonicalize_topics = true   # optional, default false
#
# Trade-off: the stemmer lowercases proper-noun-looking
# topics too (`Deploy` → `deploy`). Slugs in this codebase
# are category labels (`auth`, `frontend`, `tests`), so the
# trade is positive in practice. Operator-tunable aliases
# (`[[topic_alias]]`) + a topic-by-topic exception list are
# deferred follow-ups.

# ----------------------------------------------------------------
# Semantic memory search (Phase 75) — optional `[embedding]`
# ----------------------------------------------------------------
#
# Without this section `memory.search` is keyword-only (exactly
# the pre-Phase-75 behavior) and `mode = "semantic"` requests
# transparently fall back to keyword. Add `[embedding]` to turn
# on embedding-ranked retrieval:
#
#   - `memory.write` embeds each new entry's body at write time
#     (non-fatal — a provider hiccup just defers the vector to
#     the hourly backfill; the entry is still written and
#     keyword-findable).
#   - An hourly backfill re-embeds anything missing a vector, so
#     enabling this on an existing store gradually indexes the
#     whole back-catalog (bounded per tick — no startup stall).
#   - `aivyx memory search <q> --semantic`, the agent's
#     `memory.search` `mode` arg, and the Web UI "semantic"
#     toggle all use it.
#
# PRIVACY — read this. `base_url` is the only thing that decides
# whether memory content leaves the machine. Embedding requires
# sending the text to be embedded to the configured endpoint:
#
#   • Cloud (text leaves the box — your explicit choice):
#       [embedding]
#       base_url = "https://api.openai.com"
#       model = "text-embedding-3-small"
#       api_key = "sk-..."          # or AIVYX_EMBEDDING_API_KEY,
#                                   # or the encrypted secrets store
#       dimensions = 1536
#
#   • Local / on-device (nothing leaves the box) — point at any
#     OpenAI-compatible server (ollama, llama.cpp,
#     text-embeddings-inference). No api_key needed:
#       [embedding]
#       base_url = "http://localhost:11434"
#       model = "nomic-embed-text"
#       dimensions = 768
#
# `dimensions` must match the model's native output. If you swap
# models later, stored vectors of the old dimension are treated
# as unembedded and the backfill re-embeds them automatically.
#
# Defaults if a field is omitted (but the section is present):
#   base_url   = "https://api.openai.com"
#   model      = "text-embedding-3-small"
#   dimensions = 1536
# api_key resolves env (AIVYX_EMBEDDING_API_KEY) > this TOML key
# > the encrypted secrets store — same precedence as the
# anthropic / openai keys.
#
# ----------------------------------------------------------------
# Automatic recall (Phase 76) — `rag_top_k` / `rag_min_similarity`
# ----------------------------------------------------------------
#
# With `[embedding]` configured, the assistant doesn't only
# recall when it calls `memory.search` — every turn it embeds
# your message and silently injects the most relevant past
# memories into that turn's context (a clearly-labeled,
# reference-only block; the daemon log prints
# `aivyx recall: injected N memories [...]` when it fires). No
# embedding configured → no auto-recall, exactly as before.
#
# Two knobs tune it (both optional, shown with their defaults):
#
#   [embedding]
#   # ... base_url / model / api_key / dimensions as above ...
#   rag_top_k = 5             # max memories injected per turn
#   rag_min_similarity = 0.20 # drop hits below this cosine score
#   recall_window_turns = 1   # conversational-window relevance (Phase 86)
#   recall_gate_min_chars = 0 # heuristic recall gate (Phase 90)
#
# `rag_min_similarity` is the important one: it is the floor that
# stops an unrelated prompt from dragging in weakly-related
# noise. Raise it (e.g. 0.35) for stricter, fewer injections;
# lower it (e.g. 0.10) to recall more aggressively. Valid range
# is [0.0, 1.0]; `rag_top_k` must be >= 1.
#
# ----------------------------------------------------------------
# Conversational-window relevance (Phase 86) — recall_window_turns
# ----------------------------------------------------------------
#
# For 85 phases auto-recall (Phase 76) and adaptive Persona
# selection (Phase 79) embedded only your LATEST message — a
# lossy proxy for multi-turn intent. Phase 86 lets the
# relevance ranker see the last few turns by concatenating
# them into the same single embed it already makes (current
# message last, so it dominates).
#
# Opt-in, byte-identical by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity above ...
#   recall_window_turns = 3   # default 1 = pre-Phase-86 single line
#
# Set 1 to keep exactly today's behaviour. Raise it (2–5 is
# typical) to let recall + Persona selection consider recent
# context. The window is capped at 16 turns regardless; the
# `rag_min_similarity` / Persona-selection floors still filter
# weakly-related hits, so a drifted window never drags in
# noise. The window itself is ephemeral (daemon-memory only;
# a restart starts fresh). Validation when `[embedding]` is
# present: `recall_window_turns >= 1`.
#
# ----------------------------------------------------------------
# Heuristic recall gate (Phase 90) — recall_gate_min_chars
# ----------------------------------------------------------------
#
# For 89 phases auto-recall and adaptive Persona selection
# fired on EVERY turn, including single-token acknowledgments
# (`ok` / `thanks` / `yes` / `cool`) where the bare-message
# embed is essentially a random vector that pollutes the
# ranker. Phase 90 adds a length-based gate: when the trimmed
# user message is SHORTER than `recall_gate_min_chars`
# Unicode characters, both relevance hooks short-circuit
# before any embed call (recall returns None, the Persona
# refiner falls through to the full base prompt).
#
# Opt-in, off by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity / recall_window_turns ...
#   recall_gate_min_chars = 4   # default 0 = disabled
#
# Set 0 (default) to keep today's behaviour. Raise to gate
# noise turns; 4 is a conservative starting point that gates
# `ok` / `yes` / `cool` without touching normal messages.
# Counted in UNICODE characters, not bytes (`héllo` is 5
# chars whether or not it's 6 UTF-8 bytes). Trade-off: short
# but meaningful messages (`run!`, `ack`, `git`) gate
# alongside fillers — keep the threshold conservative if
# you use them.
#
# ----------------------------------------------------------------
# Recall feedback loop (Phase 77) — no config; learns on its own
# ----------------------------------------------------------------
#
# Once auto-recall is on AND you have a [[reflection_schedule]],
# the loop closes itself: each recall is logged, and on the
# reflection cron the assistant correlates which recalled
# memories preceded turns that went well (completed, no
# immediate operator re-ask) vs badly (failed, or you came
# right back). It uses ONLY that structural signal — it never
# asks an LLM to grade its own recall. Consistently-helpful
# memories are kept warm so they survive eviction; consistently-
# unhelpful ones are left to age out. A strongly-helpful topic
# also files a *Pending* Persona proposal you review and
# approve/reject — the loop never edits the Persona itself.
#
# There is no `[recall_feedback]` block: thresholds and the
# ~30-day recall-event retention are fixed for v1 (a tuning
# knob is a deferred follow-up). Nothing to configure — it is
# entirely a function of auto-recall + a reflection schedule
# being present. Daemon log lines `aivyx recall-feedback: …`
# show each cycle's effect.
#
# To SEE what it has learned and why (Phase 78): run
# `aivyx learning [--window <secs>]` or open the Web UI
# "Learning" tab — a read-only digest + per-proposal
# provenance. Also nothing to configure.
#
# Adaptive Persona (Phase 79): with [embedding] configured,
# once the Persona is large the assistant injects only the
# facets relevant to each turn instead of the whole accreted
# Soul. Core identity + every behavioral_constraint are ALWAYS
# injected in full (never selected away). Below the size
# threshold / no [embedding] → full Persona as before,
# byte-identical. Nothing to configure; the `aivyx learning`
# view and the daemon log (`aivyx persona: injected N/M
# facets`) show what it selected.

# ----------------------------------------------------------------
# Proactive surfacing (Phase 80) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# Lets the assistant reach out FIRST, unprompted, on its
# existing reflection cadence when it finds a concrete reason:
# a memory about to TTL-evict, a topic whose Phase 77 net
# helpfulness is strongly positive, or a `@due:` reminder whose
# time has arrived. No LLM judges WHETHER to interrupt you — the
# gate is purely structural (the Phase 77 ethos applied to the
# highest-stakes action: an unprompted OUTBOUND message).
#
# It is off unless this [proactive] block is present AND
# `enabled = true`. With it absent/false the pass is a complete
# no-op — exactly pre-Phase-80 behaviour. It also needs a
# [[reflection_schedule]] (it piggybacks that cron) and a
# matching notify target.
#
# Safety rails: a hard `max_per_window` cap (default 3/day) on
# TOP of Phase 73's per-target rate-limit, and a never-nag
# dedup log so the same item is never surfaced twice. Every
# send lands in the notify history; the last cycle shows in
# `aivyx learning` and the Web UI "Learning" tab.
#
# [proactive]
# enabled = true
# target  = "me"           # a configured notify target name
# max_per_window = 3        # optional, default 3
# window_secs    = 86400    # optional, default 86400 (1 day)
# # Each signal class defaults ON when enabled; set false to
# # mute one. At least one must stay on.
# signal_ttl_expiry     = true
# signal_recall_cluster = true
# signal_due_reminder   = true

# ----------------------------------------------------------------
# Persona lifecycle (Phase 81) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# For 80 phases the Persona ("Soul") only ever GREW. This lets
# the assistant, on its existing reflection cadence, PROPOSE
# consolidation of near-duplicate soft-list facets and decay of
# long-unreinforced ones — so the learned character stays sharp
# instead of diluting itself over months.
#
# It is off unless this [persona_lifecycle] block is present
# AND `enabled = true`. With it absent/false the pass is a
# complete no-op — exactly pre-Phase-81 behaviour. It also
# needs a [[reflection_schedule]] (it piggybacks that cron) and
# an [embedding] provider (consolidation embeds facets).
#
# Safety: it ONLY ever files Pending PersonaProposals — the
# loop never edits identity itself; you approve/reject in
# `aivyx persona` / the Web UI and `aivyx persona revert`
# undoes any approved action. The scalar identity and EVERY
# behavioral_constraint are structurally excluded — only the
# six soft lists are ever touched. A deterministic proposal id
# means it never re-proposes (never nags). The last cycle
# shows in `aivyx learning` and the Web UI "Learning" tab.
#
# [persona_lifecycle]
# enabled = true
# consolidation_similarity = 0.92   # optional, default 0.92
# decay_max_age_secs = 7776000      # optional, default ~90d
# min_soft_facets = 6               # optional, default 6
# # Phase 85 — helpfulness-driven decay (gated by signal_decay):
# # a recall-fb-derived facet whose topic's durable (Phase 82)
# # decayed helpfulness is <= this (negative) decays BEFORE the
# # age horizon; >= its magnitude PROTECTS an age-old facet.
# # Only consulted with >= decay_min_samples ledger samples
# # (no decay/protect on thin evidence). No helpfulness ledger
# # (auto-recall off) → graceful pure age-only (= Phase 81).
# # Validated only when enabled AND signal_decay is on.
# decay_unhelpful_threshold = -2.0  # optional, default -2.0
# decay_min_samples = 3             # optional, default 3
# # Phase 88 — pattern-driven decay (gated by signal_decay):
# # a consolidate-pair: facet whose underlying Phase 83 pair
# # has decayed BELOW this floor decays before the age
# # horizon (the relationship that justified the facet is
# # gone); a pair STILL at/above the floor PROTECTS the
# # facet from age-decay (mirrors the Phase 85 helpfulness
# # protection arm). Default 1.0 mirrors Phase 87's
# # [persona_consolidation].min_affinity so the construction
# # floor and the decay floor coincide; tune it BELOW to
# # add explicit hysteresis. No co-occurrence ledger (auto-
# # recall off) → byte-identical Phase 85 fallback.
# decay_pair_below_affinity = 1.0   # optional, default 1.0
# # Each class defaults ON when enabled; set false to mute one.
# # At least one must stay on.
# signal_consolidate = true
# signal_decay = true

# ----------------------------------------------------------------
# Persistent helpfulness ledger (Phase 82) — no config; automatic
# ----------------------------------------------------------------
#
# For 81 phases the "did recalling this topic help" signal was
# ephemeral (recomputed each reflection window, then discarded).
# Phase 82 makes it durable: a per-topic, time-decayed (~60-day
# half-life) accumulation folded in on the SAME reflection
# cadence as the recall-feedback loop, so the assistant can show
# what has CONSISTENTLY helped, not just what helped this week.
#
# There is no `[helpfulness_ledger]` block — like the Phase 77
# recall-feedback loop, it is entirely automatic. It is built +
# folded whenever auto-recall is configured ([embedding] +
# a [[reflection_schedule]]); with auto-recall off it does not
# exist. It is a PASSIVE signal: it changes no behaviour on its
# own (recall-feedback retention + proposals are byte-identical
# — the ledger is folded in AFTER those actuators). It
# self-prunes (decayed-to-zero + ~90d untouched → dropped), so
# nothing grows forever. Half-life / prune bounds are fixed
# code constants (tuning deferred, like the recall-log's 30-day
# retention).
#
# To SEE it: `aivyx learning` or the Web UI "Learning" tab now
# shows an "Accumulated helpfulness (all-time, decayed)" block
# (signed score + sample count) alongside the windowed view.
# Daemon log: `aivyx helpfulness-ledger: folded N, pruned M`.
# Nothing to configure.

# ----------------------------------------------------------------
# Cross-session pattern learning (Phase 83) — no config; automatic
# ----------------------------------------------------------------
#
# Phase 77 learns WHICH topics help; Phase 82 made that durable.
# Phase 83 learns the relationships BETWEEN topics: which two
# get recalled TOGETHER in turns that go well. Over many
# sessions a stable "these consistently help together" picture
# emerges (e.g. deploy-runbook + rollback-steps).
#
# Like Phase 77/82 there is NO config block — it is built +
# folded automatically whenever auto-recall is configured
# ([embedding] + a [[reflection_schedule]]); with auto-recall
# off it does not exist. It is a PASSIVE signal: folded in
# AFTER the recall-feedback actuators and the Phase 82 ledger,
# so both stay byte-identical (acting on the patterns is a
# future phase). Per turn the top-8 highest-scoring distinct
# topics are paired and accumulated with the same ~60-day
# half-life as the Phase 82 ledger; the top-8 cap bounds the
# combinatorics and it self-prunes (decayed + ~90d untouched).
#
# To SEE it: `aivyx learning` / the Web UI "Learning" tab show
# a "Topics that consistently help together" block (signed
# score + sample count). Daemon log: `aivyx cooccurrence:
# folded N, pruned M`. Nothing to configure.

# ----------------------------------------------------------------
# Cluster-aware co-recall (Phase 84) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# The first phase that ACTS on the durable learning substrate.
# When a topic is auto-recalled (Phase 76), its durable
# affined siblings from the Phase 83 co-occurrence ledger —
# topics that consistently helped alongside it across sessions
# — are ALSO surfaced, even when the literal query missed
# them. Recall becomes associative.
#
# It is off unless this [recall_cluster] block is present AND
# `enabled = true`; with it absent/false recall is
# byte-identical to pre-Phase-84. It also needs auto-recall
# configured ([embedding] + a populated co-occurrence ledger).
#
# Safety rails: siblings SHARE the existing rag_top_k budget
# (they displace the weakest primary hits — zero context/token
# growth); a hard max_siblings cap + min_affinity floor keep
# weak affinities out; and cluster-injected hits are EXCLUDED
# from the co-occurrence fold (the ledger never learns from
# its own expansion) while still measured by the Phase 77/82
# helpfulness signal (a bad expansion self-penalises).
#
# [recall_cluster]
# enabled = true
# max_siblings = 3   # optional, default 3  — hard per-turn cap
# min_affinity = 1.0 # optional, default 1.0 — decayed floor
#
# To SEE it: daemon log `aivyx recall-cluster: injected N
# affined sibling(s)`; `aivyx learning` / Web UI "Learning"
# tab show a "Cluster co-recall (last turn)" block (count +
# driver→sibling pairs).

# ----------------------------------------------------------------
# Pattern-driven Persona proposals (Phase 87) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# The second consumption of the Phase 83 co-occurrence ledger,
# symmetric with the recall-side Phase 84. When a pair of
# topics has consistently co-occurred AND both topics are
# independently helpful (Phase 82 ledger), the reflection
# cron asks the LLM to phrase a one-sentence `learned_context`
# facet and files it as a Pending Persona proposal — same
# Phase 70 propose-only + edit-then-approve + Revert flow.
#
# It is off unless this [persona_consolidation] block is
# present AND `enabled = true`; with it absent/false the
# Persona proposal pipeline is byte-identical to pre-Phase-87.
# It also needs auto-recall configured ([embedding] + a
# populated co-occurrence ledger + a populated helpfulness
# ledger + a [[reflection_schedule]]).
#
# Safety rails: a conservative DOUBLE-GATE — pair affinity +
# samples AND both endpoints independently helpful (a pattern
# of consistently-hurting topics is never proposed); per-cycle
# filings hard-capped (default 3); cross-cycle dedup is
# absolute (a pair already in the chain in ANY status is never
# re-filed); the LLM phrases the prose but the operator is
# still the final filter (edit-then-approve / reject via the
# Web UI Proposals pane or `aivyx persona proposals`).
#
# [persona_consolidation]
# enabled = true
# min_affinity = 1.0           # optional, default 1.0
# min_samples = 3              # optional, default 3
# min_topic_helpfulness = 0.0  # optional, default 0.0
# max_proposals_per_cycle = 3  # optional, default 3
#
# To SEE it: daemon log `aivyx persona-consolidation: schedule
# "X" — filed N` each cycle that fires (with
# `(LLM unavailable)` appended when the LLM is unreachable);
# `aivyx learning` / Web UI "Learning" tab show a
# "Pattern-driven Persona proposals (last cycle, opt-in)"
# block; the proposals themselves appear in `aivyx persona
# proposals` like every other Phase 70 / Phase 81 / Phase 85
# proposal.
