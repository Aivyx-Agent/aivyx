# Install-time configuration for the Aivyx PA WSL distribution (WSL 2.4.4+).
# Read once, when the `.wsl` file is installed. Lives at
# /etc/wsl-distribution.conf inside the exported rootfs.
# https://learn.microsoft.com/windows/wsl/build-custom-distro

[oobe]
# Runs once, as root, on the very first launch — creates the default user.
command = /usr/local/bin/aivyx-wsl-oobe
# The unprivileged user oobe.sh creates (first normal uid) becomes the default.
defaultUid = 1000
# Suggested distro name when the user installs the .wsl file.
defaultName = Aivyx-PA

[shortcut]
# Add a Start-menu / Windows Terminal profile entry for the distro.
enabled = true

[shell]
default = /bin/bash
