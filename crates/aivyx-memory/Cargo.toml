[package]
name = "aivyx-memory"
description = "Memory trait and default implementation for Aivyx agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# Async trait methods — same `async_trait` idiom used across the
# workspace for ChannelContext, LlmProvider, Tool, Storage.
async-trait = { workspace = true }

# MemoryEntry round-trips through serde_json for at-rest serialization.
# Phase 6 Q1 resolved in favor of JSON over bincode/postcard: zero new
# deps, human-readable inside redb when debugging, and the on-disk
# layer is already encrypted so "compact" isn't the load-bearing
# constraint.
serde = { workspace = true }
serde_json = { workspace = true }

# Typed errors, consistent with aivyx-storage and aivyx-crypto.
thiserror = { workspace = true }

# Task 2: RedbMemory wraps a DomainHandle for KeyDomain::Memory.
# Only the redb-backed impl touches this — the Memory trait and
# InMemoryMemory fake are substrate-agnostic and compile without it.
aivyx-storage = { path = "../aivyx-storage" }

# tokio::sync::Mutex inside RedbMemory — the seq counter is behind
# an async Mutex so `put` can hold it across the underlying
# DomainHandle::put .await without fighting lifetimes.
tokio = { workspace = true, features = ["sync"] }

# Task 3: the three Memory tools implement `aivyx_core::Tool`, which
# brings in ToolId / ToolContext / ToolOutcome / Verification /
# AivyxError / AuditHook / AuditTag / MemoryOperation. The
# dependency direction is fine — aivyx-core has no reverse edge to
# this crate (D8 order: core ← memory, never the other way).
aivyx-core = { path = "../aivyx-core" }

# Task 3: Scope parsing / construction for required_scope. Already
# transitively present via aivyx-core but named here for clarity
# because `tools.rs` imports `Scope` directly.
aivyx-capability = { path = "../aivyx-capability" }

[dev-dependencies]
# #[tokio::test] for the async unit tests — same split as aivyx-storage.
tokio = { workspace = true, features = ["rt", "macros"] }

# RedbMemory tests open a real RedbStorage under $TMPDIR and seed it
# with a test MasterKey. aivyx-storage is already a runtime dep, so
# we only need the crypto crate to construct the master key.
aivyx-crypto = { path = "../aivyx-crypto" }

# Scratch directory names include a v4 UUID to avoid collisions
# across concurrent test workers.
uuid = { workspace = true }
