# cargo-deny configuration — supply-chain advisory policy.
#
# Run: `cargo deny check advisories`
#
# This file exists to make Aivyx's supply-chain decisions durable and
# reviewable (backend-audit finding F5). The audit flagged three
# *unmaintained* (not vulnerable, zero CVEs) transitive crates. None is
# a direct Aivyx dependency — each is pulled deep under an upstream
# crate we don't control — so there is no code change that removes them
# until their parents update. Rather than let them sit as an unrecorded
# "known issue," they are listed here with rationale: the gate stays
# green on these three while still surfacing any *new* advisory.

# Build the dependency graph with all features so the optional
# local-LLM provider stacks (mistralrs → bm25/indicatif → fxhash /
# number_prefix) are actually evaluated — otherwise those two
# advisories are never encountered under default features and the
# ignores below read as stale.
[graph]
all-features = true

# License policy — Chapter Charter CR.1 (dependency license audit).
#
# Run: `cargo deny check licenses`
#
# Aivyx itself relicenses MIT → BUSL-1.1 (docs/LICENSING.md). For that to
# be lawful, NO dependency may impose copyleft (GPL/LGPL-only/AGPL/MPL/
# SSPL/EPL/CDDL) on the combined work. This allow-list is therefore
# permissive-only and deliberately omits every copyleft license: cargo-deny
# rejects anything not listed, so a future copyleft dep fails the gate
# loudly instead of silently poisoning the relicense.
#
# The list is the exact set of permissive SPDX ids present across the
# all-features build graph (verified green at CR.1). Notes:
#   - "BSL-1.0" = the Boost Software License (permissive) — NOT the
#     Business Source License (BUSL-1.1) Aivyx itself adopts; unrelated.
#   - LGPL-2.1-or-later is intentionally ABSENT. It appears only as one
#     option of r-efi's "MIT OR Apache-2.0 OR LGPL-2.1-or-later"; because
#     MIT/Apache are allowed, the OR resolves to a permissive choice and
#     the copyleft option is never taken. Proof the gate works as intended.
[licenses]
version = 2
# Skip Aivyx's OWN workspace crates: they relicense to BUSL-1.1 (this gate's
# whole purpose), so they must not be measured against the dependency
# allow-list below. This is scoped to first-party crates marked publish = false
# (see [workspace.package]); a THIRD-PARTY crate under BUSL/any copyleft still
# fails loudly, which is the point.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "NCSA",
    # MPL-2.0 is *file-level* (weak) copyleft: it never relicenses the larger
    # combined work — the only obligation is to share modifications to the
    # MPL-licensed files themselves, which we never touch (they are upstream
    # crates: the symphonia audio stack, the servo CSS stack pulled by Dioxus
    # — cssparser/selectors/dtoa-short — and option-ext via dirs). Fully
    # compatible with shipping Aivyx under BUSL-1.1.
    "MPL-2.0",
]

# Per-crate license exceptions (scoped — a NEW copyleft dep elsewhere still
# fails the gate loudly; that is the point of not putting these in `allow`).
exceptions = [
    # piper1-rs-sys is GPL-3.0-only (Piper TTS bindings), pulled ONLY via the
    # optional `aivyx-voice` → piper1-rs path behind the opt-in
    # `channel-voice[-full]` feature. It is NEVER in a distributed Aivyx
    # binary: cargo-dist uses `precise-builds = true` and aivyx-cli's default
    # feature set excludes voice (see dist-workspace.toml), so release
    # artifacts never compile or link it. The GPL combination only ever exists
    # in a binary a user builds from source with voice explicitly enabled —
    # their build, their GPL obligation, satisfied because they hold the
    # source. Aivyx's own crates therefore relicense to BUSL-1.1 uncontaminated.
    # (Revisit if voice is ever shipped in official binaries — that would need
    # a permissively-licensed TTS in place of Piper. Tracked in docs/LICENSING.md.)
    { allow = ["GPL-3.0-only"], crate = "piper1-rs-sys" },
]

[advisories]
version = 2
# Treat unmaintained advisories as findings (so new ones surface),
# except the three documented below.
unmaintained = "all"
yanked = "deny"
ignore = [
    # fxhash — RUSTSEC-2025-0057 (unmaintained). Pulled via
    #   fxhash → bm25 → mistralrs-core → mistralrs → aivyx-llm
    # i.e. only when an in-process mistralrs local-LLM provider feature
    # is enabled. Not a direct dep; removable only when bm25/mistralrs
    # drop it. Not vulnerable.
    { id = "RUSTSEC-2025-0057", reason = "unmaintained, not vulnerable; transitive under mistralrs (bm25); awaiting upstream" },

    # number_prefix — RUSTSEC-2025-0119 (unmaintained). Pulled via
    #   number_prefix → indicatif 0.17 → hf-hub → mistralrs-core
    # Same mistralrs local-LLM stack. Not a direct dep. Not vulnerable.
    { id = "RUSTSEC-2025-0119", reason = "unmaintained, not vulnerable; transitive under mistralrs (indicatif→hf-hub); awaiting upstream" },

    # paste — RUSTSEC-2024-0436 (unmaintained proc-macro). Pulled via
    #   paste → frankenstein (+ macro_rules_attribute) → aivyx-telegram
    # frankenstein is our Telegram Bot API wrapper; a 0.50 bump may drop
    # it, deferred to the Channel Activation Milestone (Telegram can't be
    # live-verified outside it). Not vulnerable.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, not vulnerable; transitive under frankenstein (aivyx-telegram); revisit at the frankenstein 0.50 bump" },
]
