[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Phase 61 scope: Linux x86_64 + Linux aarch64 + macOS x86_64 + macOS
# aarch64. Linux targets use musl-static (Q2(a) sign-off) so one
# binary works on every distro without glibc version drift. Native
# Windows (x86_64-pc-windows-msvc) is explicitly deferred to a
# follow-up phase — daemon IPC is Unix-domain-socket-only today;
# Windows needs a NamedPipe port. The glibc variants
# (*-unknown-linux-gnu) are intentionally omitted in favor of musl.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build ONLY the packages that ship a release artifact (aivyx-cli → the
# `aivyx` binary), not the whole workspace. Without this, cargo-dist does a
# single workspace-wide "fat build" that also compiles default-member crates
# like `aivyx-voice` (cpal → alsa-sys), which fails on the musl Linux targets
# (no ALSA, and ALSA doesn't fit a static-musl binary). `aivyx-cli`'s default
# feature set excludes voice, so a precise per-package build never touches it.
precise-builds = true
# Phase 61 Task 4 — make the release pipeline's `plan` job depend
# on the shared quality-gate reusable workflow at
# `.github/workflows/quality-gate.yml`. This causes the entire
# release pipeline (build-local-artifacts, build-global-artifacts,
# host, announce) to short-circuit if `cargo test --workspace` or
# `cargo clippy --workspace --all-targets -- -D warnings` fails.
# Mirrors the local pre-commit hook discipline; defense in depth
# alongside `.github/workflows/ci.yml`.
plan-jobs = ["./quality-gate"]
# Don't run the release workflow on pull requests — ci.yml already runs
# the quality gate on every PR, so a PR-time release run would just
# duplicate it. The release pipeline runs on version tags only.
pr-run-mode = "skip"
