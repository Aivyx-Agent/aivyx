[package]
name = "aivyx-core"
description = "Agent trait, turn loop, and core types for the Aivyx agent framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-capability = { path = "../aivyx-capability" }
aivyx-llm = { path = "../aivyx-llm" }
# Phase 51 Task 2 — D6 typed nested errors for AivyxError::Storage /
# Crypto. The Phase 1 TODOs in lib.rs:689,693 are finally closed.
# Adding these as deps was deliberately deferred at Phase 1; both
# crates are leaf-side (aivyx-storage → aivyx-crypto, aivyx-crypto →
# nothing in-workspace) so the dep graph remains acyclic.
aivyx-storage = { path = "../aivyx-storage" }
aivyx-crypto = { path = "../aivyx-crypto" }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "process"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

# Phase 12 Task 2 — web.fetch tool. Already in the workspace
# through aivyx-llm; promoting to a direct dep here so the
# tool lives next to shell.exec rather than behind a feature
# flag in the LLM crate. Zero new workspace deps.
reqwest = { workspace = true }
futures-util = { workspace = true }

# Phase 37 — base64 encoding for binary response bodies in
# web.fetch. Already transitive via reqwest/rustls; promoting
# to a direct dep. Zero new Cargo.lock entries.
base64 = { workspace = true }

# Phase 42 — process-group signaling for shell.exec. Already
# transitive via cc/aws-lc-sys; promoting to direct dep so
# shell.rs can call killpg(). Zero new Cargo.lock entries.
libc = { workspace = true }

# Phase 101 — JSON Schema validation of tool-call inputs in the
# planner's validate-before-dispatch step. `default-features =
# false` per the root Cargo.toml comment (no `$ref` resolution
# backends, no second TLS stack). First net-new workspace
# dependency since Phase 27's `notify`.
jsonschema = { workspace = true }
dom_smoothie = "0.18.0"

# Shared Landlock+seccomp process confinement for shell.exec/git.rs,
# re-exported so aivyx-cli never needs its own direct dependency on it.
aivyx-confine = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "process"] }
