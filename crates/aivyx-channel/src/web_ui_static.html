<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aivyx</title>
<style>
:root {
  --bg: #1a1b26;
  --surface: #24283b;
  --surface2: #2f3347;
  --border: #3b3f54;
  --text: #c0caf5;
  --text-dim: #737aa2;
  --accent: #7aa2f7;
  --accent-dim: #3d59a1;
  --green: #9ece6a;
  --red: #f7768e;
  --yellow: #e0af68;
  --font: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 900px;
  margin: 0 auto;
}

/* Header */
#header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
#header h1 { font-size: 16px; font-weight: 600; }
#status {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text-dim);
}
#status.connected { background: rgba(158, 206, 106, 0.15); color: var(--green); }

/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  padding: 10px 14px;
  border-radius: 8px;
  max-width: 100%;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  background: var(--accent-dim);
  align-self: flex-end;
  max-width: 70%;
}
.msg.assistant {
  background: var(--surface);
  align-self: flex-start;
}
.msg.system {
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  align-self: center;
  padding: 4px 0;
}

/* Tool calls */
.tool-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 6px 0;
  overflow: hidden;
}
.tool-header {
  padding: 6px 10px;
  font-size: 12px;
  color: var(--yellow);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tool-header .arrow { transition: transform 0.15s; }
.tool-header.open .arrow { transform: rotate(90deg); }
.tool-body {
  display: none;
  padding: 8px 10px;
  font-size: 12px;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}
.tool-body.open { display: block; }
.tool-outcome {
  padding: 4px 10px 6px;
  font-size: 12px;
  color: var(--green);
}

/* Approval gates */
.gate {
  background: rgba(224, 175, 104, 0.1);
  border: 1px solid var(--yellow);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 6px 0;
}
.gate-reason { font-size: 13px; margin-bottom: 8px; }
.gate-buttons { display: flex; gap: 8px; }
.gate-buttons button {
  padding: 4px 16px;
  border: none;
  border-radius: 4px;
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
}
.gate-buttons .approve { background: var(--green); color: var(--bg); }
.gate-buttons .deny { background: var(--red); color: var(--bg); }

/* Spinner */
.thinking {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 12px;
  padding: 4px 0;
}
.thinking .dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.2s infinite;
}
@keyframes pulse { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

/* Input */
#input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
#input-area textarea {
  flex: 1;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: var(--font);
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 38px;
  max-height: 120px;
}
#input-area textarea:focus { border-color: var(--accent); }
#input-area button {
  padding: 8px 16px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
#input-area button:hover { opacity: 0.9; }
#input-area button:disabled { opacity: 0.4; cursor: default; }
#cancel-btn {
  background: var(--red);
  display: none;
}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>Aivyx</h1>
    <span id="status">disconnected</span>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Send a message..." autofocus></textarea>
    <button id="send-btn" disabled>Send</button>
    <button id="cancel-btn">Cancel</button>
  </div>
</div>

<script>
(function() {
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const statusEl = document.getElementById('status');

  let ws = null;
  let sessionId = null;
  let currentAssistantEl = null;
  let turnActive = false;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
      statusEl.textContent = 'connected';
      statusEl.className = 'connected';
      sendBtn.disabled = false;
    };

    ws.onclose = function() {
      statusEl.textContent = 'disconnected';
      statusEl.className = '';
      sendBtn.disabled = true;
      turnActive = false;
      cancelBtn.style.display = 'none';
      setTimeout(connect, 2000);
    };

    ws.onerror = function() {
      ws.close();
    };

    ws.onmessage = function(ev) {
      let msg;
      try { msg = JSON.parse(ev.data); }
      catch(e) { return; }

      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'SessionStarted':
        sessionId = msg.session_id;
        addSystem('Session started');
        break;

      case 'StreamEvent':
        handleStreamEvent(msg.event);
        break;

      case 'TurnComplete':
        finalizeTurn(msg.outcome);
        break;

      case 'Error':
        addSystem('Error: ' + msg.message);
        finalizeTurn('error');
        break;

      case 'MissionCreated':
        addSystem('Mission created: ' + msg.mission_id);
        break;

      case 'MissionStateChanged':
        addSystem('Mission ' + msg.mission_id + ': ' + msg.state);
        break;

      case 'GateResolved':
        addSystem('Gate ' + msg.gate_id + ': ' + (msg.approved ? 'approved' : 'denied'));
        break;

      case 'ShuttingDown':
        addSystem('Daemon shutting down: ' + msg.reason);
        break;
    }

    messages.scrollTop = messages.scrollHeight;
  }

  function handleStreamEvent(event) {
    switch (event.kind) {
      case 'Text':
        ensureAssistantBubble();
        currentAssistantEl.textContent += event.text;
        break;

      case 'Status':
        showThinking(event.status);
        break;

      case 'ToolCallStarted':
        removeThinking();
        addToolCard(event.tool_id, event.tool_name, event.input);
        break;

      case 'ToolCallFinished':
        finishToolCard(event.tool_id, event.tool_name, event.outcome_summary);
        break;

      case 'ToolOutput':
        appendToolOutput(event.tool_id, event.chunk);
        break;

      case 'ApprovalGate':
        removeThinking();
        addGate(event.mission_id, event.gate_id, event.reason, event.scope);
        break;
    }
  }

  function ensureAssistantBubble() {
    removeThinking();
    if (!currentAssistantEl) {
      currentAssistantEl = document.createElement('div');
      currentAssistantEl.className = 'msg assistant';
      messages.appendChild(currentAssistantEl);
    }
  }

  function finalizeTurn(outcome) {
    turnActive = false;
    cancelBtn.style.display = 'none';
    sendBtn.disabled = false;
    currentAssistantEl = null;
    removeThinking();
    input.focus();
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'msg system';
    el.textContent = text;
    messages.appendChild(el);
  }

  function showThinking(status) {
    removeThinking();
    const el = document.createElement('div');
    el.className = 'thinking';
    el.id = 'thinking';
    el.innerHTML = '<span class="dot"></span> ' + escapeHtml(status);
    messages.appendChild(el);
  }

  function removeThinking() {
    const el = document.getElementById('thinking');
    if (el) el.remove();
  }

  function addToolCard(toolId, toolName, input) {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.id = 'tool-' + toolId;

    const header = document.createElement('div');
    header.className = 'tool-header';
    header.innerHTML = '<span class="arrow">&#9654;</span> ' + escapeHtml(toolName);
    header.onclick = function() {
      header.classList.toggle('open');
      body.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className = 'tool-body';
    body.textContent = typeof input === 'object' ? JSON.stringify(input, null, 2) : String(input);

    card.appendChild(header);
    card.appendChild(body);
    messages.appendChild(card);
  }

  function finishToolCard(toolId, toolName, outcomeSummary) {
    const card = document.getElementById('tool-' + toolId);
    if (card) {
      const outcome = document.createElement('div');
      outcome.className = 'tool-outcome';
      outcome.textContent = '\u2190 ' + toolName + ' ' + outcomeSummary;
      card.appendChild(outcome);
    }
  }

  function appendToolOutput(toolId, chunk) {
    const card = document.getElementById('tool-' + toolId);
    if (card) {
      let body = card.querySelector('.tool-body');
      if (body) {
        body.textContent += chunk;
      }
    }
  }

  function addGate(missionId, gateId, reason, scope) {
    const gate = document.createElement('div');
    gate.className = 'gate';
    gate.id = 'gate-' + gateId;

    const reasonEl = document.createElement('div');
    reasonEl.className = 'gate-reason';
    reasonEl.textContent = reason + (scope ? ' (scope: ' + scope + ')' : '');

    const buttons = document.createElement('div');
    buttons.className = 'gate-buttons';

    const approveBtn = document.createElement('button');
    approveBtn.className = 'approve';
    approveBtn.textContent = 'Approve';
    approveBtn.onclick = function() {
      resolveGate(missionId, gateId, true);
      gate.remove();
      addSystem('Gate ' + gateId + ': approved');
    };

    const denyBtn = document.createElement('button');
    denyBtn.className = 'deny';
    denyBtn.textContent = 'Deny';
    denyBtn.onclick = function() {
      resolveGate(missionId, gateId, false);
      gate.remove();
      addSystem('Gate ' + gateId + ': denied');
    };

    buttons.appendChild(approveBtn);
    buttons.appendChild(denyBtn);
    gate.appendChild(reasonEl);
    gate.appendChild(buttons);
    messages.appendChild(gate);
  }

  function resolveGate(missionId, gateId, approved) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: 'ResolveGate',
      mission_id: missionId,
      gate_id: gateId,
      approved: approved
    }));
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text || !sessionId || !ws || ws.readyState !== WebSocket.OPEN) return;

    // Show user message.
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    messages.appendChild(el);

    // Send to daemon.
    ws.send(JSON.stringify({
      type: 'SubmitInput',
      session_id: sessionId,
      text: text
    }));

    input.value = '';
    input.style.height = 'auto';
    turnActive = true;
    sendBtn.disabled = true;
    cancelBtn.style.display = 'block';
    messages.scrollTop = messages.scrollHeight;
  }

  function cancelTurn() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !sessionId) return;
    ws.send(JSON.stringify({
      type: 'CancelTurn',
      session_id: sessionId
    }));
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  // Auto-resize textarea.
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline.
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  cancelBtn.addEventListener('click', cancelTurn);

  connect();
})();
</script>
</body>
</html>
