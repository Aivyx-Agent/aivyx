[package]
name = "aivyx-audit"
description = "HMAC-chained append-only audit log for Aivyx agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }

serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Bridge integration tests drive a real ConcreteAgent turn loop through
# the bridge into an HmacChainLog. aivyx-core is already a prod dep; the
# dev-only pieces we need are tokio (for #[tokio::test]), async-trait (for
# fake ChannelContext / Tool impls), and serde_json (already a prod dep).
tokio = { workspace = true, features = ["macros", "rt"] }
async-trait = { workspace = true }
