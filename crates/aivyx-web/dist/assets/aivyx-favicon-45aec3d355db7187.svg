<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>Aivyx Favicon</title>
  <!-- Background — Stitch bg-base -->
  <rect width="32" height="32" rx="6" fill="#131319"/>
  <!-- Candle body -->
  <rect x="12.5" y="14" width="7" height="13" rx="1.5" fill="#d1c4b7"/>
  <!-- Wick -->
  <line x1="16" y1="14" x2="16" y2="11" stroke="#b8b0c8" stroke-width="1" stroke-linecap="round"/>
  <!-- Flame outer glow — warm amber -->
  <ellipse cx="16" cy="8" rx="3.5" ry="5" fill="#ffb77d" opacity="0.2"/>
  <!-- Flame body — Stitch primary -->
  <path d="M16 4 C14 7, 13 9, 16 12 C19 9, 18 7, 16 4Z" fill="#ffb77d"/>
  <!-- Flame inner — cyber purple -->
  <path d="M16 6 C15 8, 14.5 9, 16 11 C17.5 9, 17 8, 16 6Z" fill="#ccc1e6"/>
  <!-- Flame core -->
  <path d="M16 7.5 C15.5 8.5, 15.3 9, 16 10 C16.7 9, 16.5 8.5, 16 7.5Z" fill="#fff5e0"/>
  <!-- Candle base -->
  <rect x="11" y="26" width="10" height="2.5" rx="1" fill="#b8b0c8" opacity="0.6"/>
</svg>
