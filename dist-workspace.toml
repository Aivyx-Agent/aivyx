[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Phase 61 scope: Linux x86_64 + Linux aarch64 + macOS x86_64 + macOS
# aarch64. Linux targets use musl-static (Q2(a) sign-off) so one
# binary works on every distro without glibc version drift. Native
# Windows (x86_64-pc-windows-msvc) is explicitly deferred to a
# follow-up phase — daemon IPC is Unix-domain-socket-only today;
# Windows needs a NamedPipe port. The glibc variants
# (*-unknown-linux-gnu) are intentionally omitted in favor of musl.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
