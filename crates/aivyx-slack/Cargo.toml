[package]
name = "aivyx-slack"
description = "Slack ChannelContext adapter — Phase 108's fourth concrete channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

# Phase 108 — mirrors aivyx-discord and aivyx-telegram's pattern.
# Do NOT depend on aivyx-channel: the aivyx binary in that crate
# calls into aivyx_slack::run_slack_session, which would cycle
# aivyx-slack → aivyx-channel → aivyx-slack. The session driver
# defines its own SlackSessionConfig mirroring
# DiscordSessionConfig minus the Discord-specific fields.
aivyx-llm = { path = "../aivyx-llm" }
aivyx-storage = { path = "../aivyx-storage" }
serde_json = { workspace = true }

# Phase 108 task 2 — slack-morphism is the maintained Rust SDK
# for Slack. Same posture as the Phase 8 frankenstein adoption
# (Telegram) and the Phase 107 twilight-rs adoption (Discord) —
# pick a thin protocol wrapper that exposes raw API methods, not
# a framework that owns its own event loop. Q1a sign-off.
#
# Features:
# - `hyper`: pulls in the HTTP client backend slack-morphism uses
#   for REST. Required for any production use of the SDK.
# - `socket-mode`: enables the Socket Mode WebSocket client per
#   Q2a sign-off. Without this feature the SDK builds REST-only.
#
# The 2.x line is the current stable major-series at Phase 108
# entry. Pinned with `~` so a patch bump can land via Cargo.lock
# without the manifest churning.
slack-morphism = { version = "2", default-features = false, features = ["hyper", "axum"] }

# Phase 111 — slack-morphism's error_handler callback returns
# `http::StatusCode`. The `http` crate is transitive via reqwest
# / hyper already in the workspace; promoting to a direct dep
# costs zero compile time but makes the signature use legible.
http = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
aivyx-audit = { path = "../aivyx-audit" }
aivyx-crypto = { path = "../aivyx-crypto" }
