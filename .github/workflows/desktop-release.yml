# Builds the native desktop app (`aivyx-desktop`) into installable bundles and
# attaches them to the GitHub Release. This is SEPARATE from the cargo-dist CLI
# release (`release.yml`): the desktop shell links a system webview, so it is
# gnu-linked (not musl-static like the `aivyx` CLI) and packaged with
# `cargo-bundle` (a `.deb` on Linux, a `.app`/`.dmg` on macOS).
#
# Exercised on the v0.7.0 release: the Linux `.deb` and macOS `.app` both build
# correctly on real runners. cargo-dist's `release.yml` is the sole release
# CREATOR; this workflow waits for that release to exist and then UPLOADS its
# bundles to it — never creates the release — so the two don't race on "create"
# (which is what broke the first v0.7.0 run). The Intel-macOS runner can queue
# for a while in the public-repo pool, so its asset may attach late.
# Windows is intentionally absent — it rides on the future daemon port.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # attach assets to the release

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (webview + tray + libxdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-bundle --locked
      - name: Bundle (.deb)
        working-directory: crates/aivyx-desktop
        run: cargo bundle --release --format deb
      # Attach to the release cargo-dist creates (release.yml) — wait for it to
      # exist first, then UPLOAD (never create), so we don't race cargo-dist's
      # "Create GitHub Release" step (it fails if the release already exists).
      - name: Attach .deb to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for cargo-dist to create release $GITHUB_REF_NAME… ($i)"
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/deb/*.deb --clobber
      - name: Upload artifact (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivyx-desktop-linux-deb
          path: target/release/bundle/deb/*.deb

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-13 # x86_64
            target: x86_64-apple-darwin
          - runner: macos-14 # aarch64 (Apple Silicon)
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cargo-bundle --locked
      - name: Bundle (.app)
        working-directory: crates/aivyx-desktop
        run: cargo bundle --release --format osx
      # A `.app` is a directory — zip it so it can be a single release asset.
      - name: Zip the .app
        run: |
          cd target/release/bundle/osx
          zip -r -y "aivyx-desktop-${{ matrix.target }}.zip" *.app
      # Wait for the cargo-dist release, then upload (never create) — see the
      # Linux job for why.
      - name: Attach .app zip to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for cargo-dist to create release $GITHUB_REF_NAME… ($i)"
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/osx/*.zip --clobber
      - name: Upload artifact (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivyx-desktop-${{ matrix.target }}
          path: target/release/bundle/osx/*.zip
