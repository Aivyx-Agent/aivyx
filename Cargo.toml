[workspace]
resolver = "2"
members = [
    "crates/aivyx-core",
    "crates/aivyx-crypto",
    "crates/aivyx-capability",
    "crates/aivyx-audit",
    "crates/aivyx-config",
    "crates/aivyx-storage",
    "crates/aivyx-llm",
    "crates/aivyx-memory",
    "crates/aivyx-channel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Julian <julian@aivyx-studio.com>"]
repository = "https://github.com/AivyxDev/aivyx"
readme = "README.md"

[workspace.dependencies]
# Core async runtime — shared so all crates use the same version
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling — per D6
thiserror = "2"

# UUIDs for newtype IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Glob matching for scope attenuation (simple-glob + path-glob qualifier kinds)
globset = "0.4"

# Audit log: HMAC-SHA256 over canonical JSON per RFC 8785 (per D1 + D4)
hmac = "0.13"
sha2 = "0.11"
serde_jcs = "0.2"

# LLM provider HTTP transport (feature-gated in aivyx-llm via provider-anthropic)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Bearer token wrapper — prevents accidental Debug/logging of API keys
secrecy = { version = "0.10", features = ["serde"] }
# Byte stream utilities used by the SSE parser
futures-util = "0.3"
bytes = "1"
