[package]
name = "aivyx-llm"
description = "LlmProvider trait and reference implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# Protocol-only crate — no dependency on aivyx-core. The LlmProvider
# trait and its associated types use `serde_json::Value` for tool
# inputs/outputs and `tokio_util::sync::CancellationToken` for mid-
# stream cancellation; neither requires core types.
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
