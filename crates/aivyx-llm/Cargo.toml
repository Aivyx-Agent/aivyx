[package]
name = "aivyx-llm"
description = "LlmProvider trait and reference implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
# Opt-in: pulls in reqwest + rustls + secrecy and compiles the Anthropic
# reference provider. Downstream crates (e.g. aivyx-core) that only need
# the LlmProvider trait and LlmError must NOT enable this feature.
provider-anthropic = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]
provider-openai = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]
# Phase 121 — native Ollama adapter against `/api/chat` (JSONL
# streaming). Distinct from `provider-openai`'s Ollama-via-OpenAI-compat
# path; the two coexist so the OpenAI-compat code stays for
# `ProviderKind::OpenAi`. Pulls in the same transport deps as the
# other providers.
provider-ollama = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]

[dependencies]
# Protocol-only core — no dependency on aivyx-core. The LlmProvider
# trait and its associated types use `serde_json::Value` for tool
# inputs/outputs and `tokio_util::sync::CancellationToken` for mid-
# stream cancellation; neither requires core types.
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }

# Feature-gated: only compiled when `provider-anthropic` is on. Keeping
# these optional means `aivyx-core` (which depends on this crate purely
# for LlmError) never links reqwest/rustls/secrecy.
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
