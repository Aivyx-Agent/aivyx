[package]
name = "aivyx-kitchen"
description = "Kitchen / Back-of-House vertical pack — the BOH Nonagon team config + the overnight-close mission (Chapter J.6). See docs/VERTICAL_PACKS.md + docs/NONAGON.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# A vertical pack is config over the free engine: the kitchen team is a
# customised TeamConfig + a MissionPlan, plus the TrustTier-tiered scopes. ALL
# of it comes through the stable `aivyx-vertical-sdk` facade — a pack never
# depends on the engine crates (aivyx-team / aivyx-capability / ...) directly,
# so core refactors can't break it. NO substrate fork — packs inherit the engine.
aivyx-vertical-sdk = { path = "../../aivyx-vertical-sdk" }
