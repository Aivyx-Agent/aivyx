[package]
name = "aivyx-audit"
description = "HMAC-chained append-only audit log for Aivyx agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }

serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Bridge integration tests drive a real ConcreteAgent turn loop through
# the bridge into an HmacChainLog. aivyx-core is already a prod dep; the
# dev-only pieces we need are tokio (for #[tokio::test]), async-trait (for
# fake ChannelContext / Tool impls), and serde_json (already a prod dep).
tokio = { workspace = true, features = ["macros", "rt"] }
async-trait = { workspace = true }
# Phase 2 task 5 E2E integration test pulls in the Anthropic reference
# provider + its fake-transport seam so the test can drive the whole
# stack (agent → LlmPlanner → AnthropicProvider → FakeTransport → SSE
# parser → audit bridge → HmacChainLog) without touching the network.
aivyx-llm = { path = "../aivyx-llm", features = ["provider-anthropic"] }
# SecretString for the fake API key the provider config expects.
secrecy = { workspace = true }
# Fake transport builds canned SSE byte streams via futures::stream::iter.
futures-util = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
