# Per-launch configuration for the Aivyx PA WSL distribution. Lives at
# /etc/wsl.conf inside the exported rootfs and is applied every time the
# distro boots. https://learn.microsoft.com/windows/wsl/wsl-config

[boot]
# The Aivyx PA daemon is auto-started by the frontends (or `aivyx-pa serve`), not a
# systemd unit inside this image, so systemd is left off for reliability.
systemd = false

[user]
# Always log in as the unprivileged user created during OOBE, never root.
default = aivyx

[network]
generateHosts = true
generateResolvConf = true

[interop]
# Let the agent reach Windows executables when explicitly asked; the local-first
# posture is unchanged (files still live inside the WSL filesystem).
enabled = true
appendWindowsPath = true
