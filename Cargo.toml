[workspace]
resolver = "2"
members = [
    "crates/aivyx-core",
    "crates/aivyx-crypto",
    "crates/aivyx-capability",
    "crates/aivyx-audit",
    "crates/aivyx-config",
    "crates/aivyx-storage",
    "crates/aivyx-llm",
    "crates/aivyx-memory",
    "crates/aivyx-channel",
    "crates/aivyx-telegram",
    "crates/aivyx-discord",
    "crates/aivyx-slack",
    "crates/aivyx-mcp",
    "crates/aivyx-tool",
    "crates/aivyx-gmail",
    "crates/aivyx-toolkit",
    "crates/aivyx-calendar",
    "crates/aivyx-google-oauth",
    "crates/aivyx-drive",
    "crates/aivyx-notion",
    "crates/aivyx-obsidian",
    "crates/aivyx-n8n",
    "crates/aivyx-auth-cli",
    "crates/aivyx-voice",
    "crates/aivyx-tui",
    "crates/aivyx-cli",
    "crates/aivyx-team",
    "crates/aivyx-team-types",
    "crates/aivyx-ipc",
    "crates/aivyx-kitchen",
    "crates/aivyx-cost",
    "crates/aivyx-web",
]

# Chapter M — `aivyx-web` is a Dioxus app that only compiles for
# `wasm32-unknown-unknown` (web-sys / wasm-bindgen). Excluding it from
# `default-members` keeps a bare `cargo build` / `cargo test` (native) from
# trying to build it; it is built explicitly with
# `cargo build -p aivyx-web --target wasm32-unknown-unknown` (and via `dx` /
# CI in M.5).
default-members = [
    "crates/aivyx-core",
    "crates/aivyx-crypto",
    "crates/aivyx-capability",
    "crates/aivyx-audit",
    "crates/aivyx-config",
    "crates/aivyx-storage",
    "crates/aivyx-llm",
    "crates/aivyx-memory",
    "crates/aivyx-channel",
    "crates/aivyx-telegram",
    "crates/aivyx-discord",
    "crates/aivyx-slack",
    "crates/aivyx-mcp",
    "crates/aivyx-tool",
    "crates/aivyx-gmail",
    "crates/aivyx-toolkit",
    "crates/aivyx-calendar",
    "crates/aivyx-google-oauth",
    "crates/aivyx-drive",
    "crates/aivyx-notion",
    "crates/aivyx-obsidian",
    "crates/aivyx-n8n",
    "crates/aivyx-auth-cli",
    "crates/aivyx-voice",
    "crates/aivyx-tui",
    "crates/aivyx-cli",
    "crates/aivyx-team",
    "crates/aivyx-team-types",
    "crates/aivyx-ipc",
    "crates/aivyx-kitchen",
    "crates/aivyx-cost",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Aivyx <aivyx@aivyx-studio.com>"]
repository = "https://github.com/Aivyx-Agent/aivyx"
readme = "README.md"

[workspace.dependencies]
# Core async runtime — shared so all crates use the same version
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling — per D6
thiserror = "2"

# UUIDs for newtype IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Glob matching for scope attenuation (simple-glob + path-glob qualifier kinds)
globset = "0.4"

# Audit log: HMAC-SHA256 over canonical JSON per RFC 8785 (per D1 + D4)
hmac = "0.13"
sha2 = "0.11"
serde_jcs = "0.2"

# Base64 encoding for binary response bodies in web.fetch (Phase 37)
base64 = "0.22"

# LLM provider HTTP transport (feature-gated in aivyx-llm via provider-anthropic)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Bearer token wrapper — prevents accidental Debug/logging of API keys
secrecy = { version = "0.10", features = ["serde"] }
# Byte stream utilities used by the SSE parser
futures-util = "0.3"
bytes = "1"

# Cron expression parsing for scheduled execution (Phase 26)
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# HTTP server for webhook triggers (Phase 27) — already transitive via reqwest
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# WebSocket support for web UI channel (Phase 39)
tokio-tungstenite = "0.26"

# File-system change notifications for file-watch triggers (Phase 27)
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Unix process-group signaling for shell.exec (Phase 42)
libc = "0.2"

# Phase 68 — SMTP client for the email notify backend.
# `default-features = false` + explicit rustls features is
# load-bearing: we keep TLS aligned with our existing reqwest
# rustls-tls policy and never pull in system openssl by
# accident.
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "rustls-native-certs",
    "smtp-transport",
    "builder",
    "hostname",
] }

# Phase 101 — JSON Schema validation for tool-call inputs. The
# planner validates a known tool's call arguments against the
# tool's `input_schema()` before dispatch.
#
# `default-features = false` is load-bearing: the crate's default
# features (`reqwest`, `resolve-http`, `resolve-file`,
# `tls-aws-lc-rs`) exist to resolve external `$ref`s over the
# network — which the in-tree tool schemas never use, and which
# would pull a second TLS stack (`aws-lc-rs`) against the
# workspace's rustls-only policy. With defaults off we get the
# synchronous in-memory validator and nothing else.
jsonschema = { version = "0.46", default-features = false }

# Phase 185 — Terminal UI stack for the `aivyx tui` frontend. These
# are the FIRST new workspace dependencies since well before Phase
# 172, deliberately ending the zero-new-dep streak: a real terminal
# UI genuinely requires a terminal-UI library, and ratatui +
# crossterm are the load-bearing, widely-audited, pure-Rust choice.
# They are QUARANTINED to the `aivyx-tui` crate (and the binary that
# launches it) — no substrate crate (`aivyx-core`,
# `aivyx-capability`, `aivyx-storage`, `aivyx-crypto`, …) may depend
# on them, so the substrate stays dependency-clean. A future audit
# should confirm `aivyx-tui` is the only ratatui consumer.
ratatui = "0.30"
crossterm = "0.29"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
