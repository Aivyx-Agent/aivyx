[package]
name = "aivyx-federation"
description = "Agent identity & cross-boundary trust — the federation keystone (Chapter Passport / docs/FEDERATION.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# The new-core capability vocabulary — `TrustPolicy.allowed_scopes` and the
# cross-operator attenuation (PP.2) are expressed in `Scope` / `CapabilitySet`,
# reusing `Scope::is_granted_by` (NT-02 generalized).
aivyx-capability = { path = "../aivyx-capability" }

# PP.1 (identity) — Ed25519 keypair + signed, replay-guarded envelope.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# Key-at-rest is sealed with a subkey derived from the storage MasterKey, reusing
# the new core's audited HKDF + ChaCha20-Poly1305 (NOT the salvage's hand-rolled
# AEAD) — the "modernize onto the new core" path (PP.0 decision 1).
aivyx-crypto = { path = "../aivyx-crypto" }

# PP.2 (trust) — the Reins AutonomyLevel is the per-peer autonomy ceiling.
aivyx-config = { path = "../aivyx-config" }

# PP.3 (relay) — the wasm-clean relay verbs (RelayRequest/Response) the signed
# envelope wraps; serde_json produces the canonical body bytes that are signed.
aivyx-ipc = { path = "../aivyx-ipc" }
serde_json = { workspace = true }

# Task 7 (Chapter Passport, hardware-backed identity): hardware-backed Ed25519
# signing via a YubiKey's OpenPGP card applet. Centralized in the root
# Cargo.toml's `[workspace.dependencies]` as a `git` dependency (pinned by
# commit SHA), same pattern as `aivyx-confine`/`aivyx-checkpoint`/
# `aivyx-kvcache` — a real GitHub remote now exists
# (github.com/Aivyx-Agent/aivyx-yubi), created specifically so this
# dependency wouldn't need a fragile local `path` reference that breaks CI
# and every other contributor's checkout (a `path` dependency's manifest
# must be resolvable on disk even when the feature gating it is off; a
# `git` dependency only needs the remote reachable, and is never touched at
# all when the `yubikey` feature — see below — isn't enabled). `optional`:
# gated behind the `yubikey` feature (default off) — `aivyx-yubi`
# transitively needs `libpcsclite` at build time (via `pcsc-sys`), which
# isn't installed on every contributor's machine or in the default CI job,
# so it must never be pulled in by a plain `cargo build --workspace`.
aivyx-yubi = { workspace = true, optional = true }
# Only needed for the hardware-signing arm of `sign_request`, which
# `spawn_blocking`s the actual (multi-second, touch-gated) signing call off
# the calling executor thread. Optional + tied to the same `yubikey` feature
# so a default build never pulls in a tokio runtime as a hard dependency of
# this crate (it's otherwise only a dev-dependency, for `#[tokio::test]`).
tokio = { workspace = true, optional = true }

[features]
# Off by default: see the `aivyx-yubi` dependency comment above for why.
# Enable with `cargo build -p aivyx-federation --features yubikey` (needs
# `libpcsclite`/pkg-config available locally to build `pcsc-sys`; `aivyx-yubi`
# itself is fetched automatically from its own `git` remote by Cargo, no
# local sibling checkout needed).
yubikey = ["dep:aivyx-yubi", "dep:tokio"]

[dev-dependencies]
uuid = { workspace = true }
serde_json = { workspace = true }
# PP.6 integration proof names the public-API types from the substrate's deps.
aivyx-capability = { path = "../aivyx-capability" }
aivyx-config = { path = "../aivyx-config" }
aivyx-ipc = { path = "../aivyx-ipc" }
# `sign_request`/`sign_relay` are async (Task 7 -- the hardware-backed path
# can legitimately block for seconds on a physical touch), so tests calling
# them need a runtime. Already a workspace dependency with `macros` +
# `rt-multi-thread` (a superset of the bare `rt` feature `#[tokio::test]`
# needs) via `[workspace.dependencies]`, so no extra features are required
# here.
tokio = { workspace = true }
