[package]
name = "aivyx-team"
description = "Nonagon multi-agent teams — a lead agent convening up to 9 attenuated specialists (Chapter J). See docs/NONAGON.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# The safety story rests on aivyx-capability's Scope / CapabilitySet /
# TrustTier. J.2 adds construction: the SpecialistFactory builds attenuated
# specialist `ConcreteAgent`s (aivyx-core) driven by an injected
# `LlmProvider` (aivyx-llm). `aivyx-team` sits above core/llm/capability
# and below the daemon — a clean DAG, no cycle.
aivyx-capability = { path = "../aivyx-capability" }
aivyx-core = { path = "../aivyx-core" }
aivyx-llm = { path = "../aivyx-llm" }
# J.2.2: the SpecialistChannel impls ChannelContext (#[async_trait]) — a
# real dep now, not just for tests.
async-trait = { workspace = true }
serde = { workspace = true }
# J.2.3: the delegation tools build JSON schemas + outputs.
serde_json = { workspace = true }
# J.3: the MessageBus is a bounded tokio broadcast channel.
tokio = { workspace = true, features = ["sync"] }
# J.4.2: the TeamRuntime runs a DAG's independent ready steps concurrently
# via join_all.
futures-util = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }

[dev-dependencies]
# Turn-running tests need a Tokio runtime for the sub-turn; J.4.2's
# concurrency proof needs a Barrier + a timeout guard (sync + time).
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
