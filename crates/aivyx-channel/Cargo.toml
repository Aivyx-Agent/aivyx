[package]
name = "aivyx-channel"
description = "ChannelContext trait and LocalChannel reference implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
async-trait = { workspace = true }

# Binary-only deps below. The library target (lib.rs) only needs the
# three entries above; the `aivyx` bin pulls in the rest so a single
# `cargo run --bin aivyx` launches the full agent stack.
aivyx-audit = { path = "../aivyx-audit" }
aivyx-llm = { path = "../aivyx-llm", features = ["provider-anthropic"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "signal"] }
secrecy = { workspace = true }

[dev-dependencies]
# LocalChannel unit tests exercise the async ChannelContext surface
# against an in-memory Vec<u8> sink; tokio drives #[tokio::test] and
# serde_json builds the tool-call inputs the tests feed in.
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[[bin]]
name = "aivyx"
path = "src/bin/aivyx.rs"
